[package]
name = "archive-fuzz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "archive-fuzz"
path = "src/main.rs"

[dependencies]
archive = { path = "..", features = ["std", "tar", "cpio", "ar", "deb", "rpm", "squashfs", "mscab", "zim", "mtree", "warc", "lha", "arj", "arc", "xca", "lzf", "fastlz", "lzrw1", "lzrw1a", "lzrw2", "lzrw3", "lzrw3a", "lzsa", "zx0", "zx1", "zx2", "lzxd", "cmpsc", "gzip", "zstd", "bzip2", "lzip", "lzma-alone", "lzw", "lz4", "lzo", "lrzip", "xz", "zlib", "zpaq", "rzip", "snappy", "zip", "sevenz"] }
sha3 = "0.10.8"
blake3 = "1.8.3"
rand = "0.10.0"
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3.23.0"
