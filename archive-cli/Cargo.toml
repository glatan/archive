[package]
name = "archive-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["json"]
json = ["dep:serde", "dep:serde_json"]

[[bin]]
name = "archive"
path = "src/main.rs"
doc = false

[[bin]]
name = "archive-bench-helper"
path = "src/bin/bench_helper.rs"
doc = false

[dependencies]
archive = { path = "..", default-features = false, features = ["std", "tar", "cpio", "ar", "deb", "rpm", "squashfs", "cramfs", "romfs", "erofs", "iso9660", "crx3", "pea", "mscab", "mscfb", "zim", "mtree", "warc", "lha", "arj", "arc", "git-pack", "xar", "xca", "lzf", "fastlz", "lzrw1", "lzrw1a", "lzrw2", "lzrw3", "lzrw3a", "lzsa", "zx0", "zx1", "zx2", "zx5", "vcdiff", "mppc", "lzs", "lzxd", "cmpsc", "uuencode", "ascii85", "yenc", "macbinary", "binhex", "packbits", "gzip", "zstd", "bzip2", "lzip", "lzma-alone", "lzw", "lz4", "lzo", "lrzip", "xz", "zlib", "zpaq", "rzip", "snappy", "brotli", "zip", "sevenz"] }
clap = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
