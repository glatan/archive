[package]
name = "archive-cli"
version.workspace = true
edition.workspace = true

[features]
default = ["json"]
json = ["dep:serde", "dep:serde_json"]

[[bin]]
name = "archive"
path = "src/main.rs"
doc = false

[dependencies]
archive = { path = "..", default-features = false, features = ["std", "tar", "cpio", "ar", "deb", "rpm", "squashfs", "mscab", "zim", "mtree", "warc", "xca", "lzf", "fastlz", "lzrw1a", "lzsa", "zx0", "lzxd", "cmpsc", "gzip", "zstd", "bzip2", "lzip", "lzma-alone", "lzw", "lz4", "lzo", "lrzip", "xz", "zlib", "zpaq", "rzip", "snappy", "brotli", "zip", "sevenz"] }
clap = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
