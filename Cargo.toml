[package]
name = "archive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pure Rust archive and compression library (DEFLATE, gzip, zlib, zstd, bzip2, lzip, lzma, xz, LZW, LZ4, LZO, Snappy, Brotli, ZPAQ, rzip, lrzip, tar, cpio, ar, zip, 7z, deb, rpm, squashfs, cramfs, romfs, erofs, iso9660, crx3, pea, mscab, mscfb, zim, mtree, warc, lha, arj, arc, git-pack, xar, xca, lzf, fastlz, lzrw1, lzrw1a, lzrw2, lzrw3, lzrw3a, lzsa, zx0, zx1, zx2, zx5, vcdiff, mppc, lzs, lzxd, cmpsc, uuencode, ascii85, yenc, macbinary, binhex, packbits)"

[features]
default = ["std", "tar", "cpio", "ar", "deb", "rpm", "squashfs", "cramfs", "romfs", "erofs", "iso9660", "crx3", "pea", "mscab", "mscfb", "zim", "mtree", "warc", "lha", "arj", "arc", "git-pack", "xar", "xca", "lzf", "fastlz", "lzrw1", "lzrw1a", "lzrw2", "lzrw3", "lzrw3a", "lzsa", "zx0", "zx1", "zx2", "zx5", "vcdiff", "mppc", "lzs", "lzxd", "cmpsc", "uuencode", "ascii85", "yenc", "macbinary", "binhex", "packbits", "gzip", "zstd", "bzip2", "lzip", "lzma-alone", "lzw", "lz4", "lzo", "lrzip", "xz", "zlib", "zpaq", "rzip", "snappy"]
std = []
tar = []
cpio = []
ar = []
deb = ["ar", "tar", "gzip", "xz", "zstd", "bzip2", "lzma-alone", "lzw"]
rpm = ["cpio", "gzip", "bzip2", "xz", "zstd", "lzma-alone"]
squashfs = ["zlib", "lzo", "lz4", "xz", "zstd"]
cramfs = ["zlib"]
romfs = []
erofs = []
iso9660 = ["zlib"]
crx3 = ["zip"]
pea = ["zlib"]
mscab = ["deflate"]
mscfb = []
zim = ["xz", "zstd"]
mtree = []
warc = []
git-pack = ["zlib"]
xar = ["zlib", "bzip2", "lzma-alone", "xz"]
lha = []
arj = []
arc = ["lzw"]
xca = []
lzf = []
fastlz = []
lzrw1 = []
lzrw1a = []
lzrw2 = []
lzrw3 = []
lzrw3a = []
lzsa = []
zx0 = []
zx1 = []
zx2 = []
zx5 = []
vcdiff = []
mppc = []
lzs = []
lzxd = []
cmpsc = []
uuencode = []
ascii85 = []
yenc = []
macbinary = []
binhex = []
packbits = []
gzip = ["deflate"]
deflate = []
zstd = []
bzip2 = []
lzip = []
lzma-alone = []
lzw = []
lz4 = []
lzo = []
rzip = ["bzip2"]
zlib = ["deflate"]
zpaq = []
lrzip = ["lzip", "bzip2", "lzo", "zlib", "zpaq", "rzip"]
xz = ["lzip"]
snappy = []
brotli = []
zip = ["deflate", "bzip2", "lzip", "zstd"]
sevenz = ["deflate", "lzip", "bzip2", "xz", "brotli"]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.6.0"
serde_json = "1.0.149"
libc = "0.2"

[[bench]]
name = "compress"
harness = false

[[bench]]
name = "archive"
harness = false

[[bench]]
name = "compare"
harness = false

[workspace]
members = [".", "archive-cli", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-only"

[workspace.dependencies]
clap = { version = "4.6.0", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[profile.fuzz]
inherits = "release"
debug-assertions = true
overflow-checks = true
