[package]
name = "archive"
version.workspace = true
edition.workspace = true
description = "Pure Rust archive and compression library (DEFLATE, gzip, zlib, zstd, bzip2, lzip, lzma, xz, LZW, LZ4, LZO, Snappy, Brotli, ZPAQ, rzip, lrzip, tar, cpio, ar, zip, 7z, deb, rpm, squashfs)"

[features]
default = ["std", "tar", "cpio", "ar", "deb", "rpm", "squashfs", "gzip", "zstd", "bzip2", "lzip", "lzma-alone", "lzw", "lz4", "lzo", "lrzip", "xz", "zlib", "zpaq", "rzip", "snappy"]
std = []
tar = []
cpio = []
ar = []
deb = ["ar", "tar", "gzip", "xz", "zstd", "bzip2", "lzma-alone", "lzw"]
rpm = ["cpio", "gzip", "bzip2", "xz", "zstd", "lzma-alone"]
squashfs = ["zlib", "lzo", "lz4", "xz", "zstd"]
gzip = ["deflate"]
deflate = []
zstd = []
bzip2 = []
lzip = []
lzma-alone = []
lzw = []
lz4 = []
lzo = []
rzip = []
zlib = ["deflate"]
zpaq = []
lrzip = ["lzip", "bzip2", "lzo", "zlib", "zpaq", "rzip"]
xz = ["lzip"]
snappy = []
brotli = []
zip = ["deflate", "bzip2", "lzip", "zstd"]
sevenz = ["deflate", "lzip", "bzip2", "xz", "brotli"]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "compress"
harness = false

[[bench]]
name = "archive"
harness = false

[workspace]
members = [".", "archive-cli", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4.6.0", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
